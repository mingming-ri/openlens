<!doctype html>
<html lang="en" data-text-size="normal" data-contrast="normal" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenLens reads text from images and speaks it aloud. Images are processed on your device." />
    <meta name="theme-color" content="#161826" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161826'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%239184d9' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d2cefd'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved display settings before the page paints, so light mode doesn't flash dark.
      try {
        var s = JSON.parse(localStorage.getItem('openlens.settings.v2') || '{}');
        var light = s.theme ? s.theme === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (s.textSize) document.documentElement.dataset.textSize = s.textSize;
        if (s.highContrast) document.documentElement.dataset.contrast = 'high';
      } catch (e) {}
    </script>
    <title>OpenLens: read text from images aloud</title>
  </head>
  <body>
    <noscript>OpenLens needs JavaScript turned on to read images.</noscript>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
